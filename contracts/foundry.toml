[profile.default]
src = "src"
out = "out"
libs = ["lib", "../node_modules"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "prague"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
]
allow_paths = ["../node_modules"]

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"
